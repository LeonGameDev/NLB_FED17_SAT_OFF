<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Nocturne Tarot{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topbar">
        <a class="brand" href="{{ url_for('________') }}" {# TASK 1 | Example: url_for('home') #}>NOCTURNE TAROT</a>
        <nav>
            <a href="{{ url_for('________') }}" {# TASK 2 | Example: url_for('about') #}>All Cards</a>
            {% if session.get('profile_id') %}
                <a href="{{ url_for('history') }}">History</a>
                <a href="{{ url_for('restart') }}">New Profile</a>
            {% endif %}
        </nav>
    </header>

    <main class="page-shell">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer-note">
        A classroom project for entertainment and self-reflection. It does not predict the future.
    </footer>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
